name: Hybrid Linux Build & FTP cPanel Deploy

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_linux:
        description: 'Build Linux packages (.deb & .AppImage)'
        type: boolean
        required: false
        default: false

jobs:
  build-linux-and-deploy:
    name: Build Linux .deb and Sync to cPanel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check if Linux Build is Requested
        id: check_build
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          INPUT_BUILD="${{ github.event.inputs.build_linux }}"
          
          if [ "$INPUT_BUILD" = "true" ] || echo "$COMMIT_MSG" | grep -iqE "\[build linux\]|\[linux build\]|\[linux\]"; then
            echo "BUILD_LINUX=true" >> $GITHUB_OUTPUT
            echo "🚀 Linux build IS requested for this run."
          else
            echo "BUILD_LINUX=false" >> $GITHUB_OUTPUT
            echo "⚡ Skipping Linux build by default (include '[build linux]' in commit message or trigger manually to build Linux)."
          fi

      - name: Install System Dependencies for Tauri
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            fuse \
            libfuse2

      - name: Setup Node.js
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Toolchain
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies (Rust Cache)
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm Dependencies
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        run: npm ci

      - name: Build Tauri App (Linux AppImage & deb)
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Process Linux Release (Post-Build Linux)
        if: ${{ steps.check_build.outputs.BUILD_LINUX == 'true' }}
        run: |
          node post-build-linux.cjs
          echo "Current list of files in website/downloads/:"
          ls -lh website/downloads/

      # Opsi A: FTP Deploy saat versi Linux di-build (unggah semua termasuk biner Linux)
      - name: FTP Deploy Website to cPanel (With Linux Build)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-linux') && steps.check_build.outputs.BUILD_LINUX == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: loose
          local-dir: ./website/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json

      # Opsi B: FTP Deploy saat versi Linux dilompati (Default: jangan hapus biner Linux di cPanel!)
      - name: FTP Deploy Website to cPanel (Default: Skip Linux Build)
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows-linux') && steps.check_build.outputs.BUILD_LINUX != 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          security: loose
          local-dir: ./website/
          server-dir: ./
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/downloads/*.deb
            **/downloads/*.AppImage
            **/downloads/*.AppImage.tar.gz
            **/downloads/*.AppImage.tar.gz.sig
            **/downloads/*.deb.tar.gz
            **/downloads/*.deb.tar.gz.sig