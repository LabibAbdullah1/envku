<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hard Offset Shadow -->
  <rect x="5" y="5" width="55" height="55" rx="10" fill="#09090b"/>
  
  <!-- Main Base Container (Lemon Yellow Neo-Brutalist Card) -->
  <rect x="2" y="2" width="55" height="55" rx="10" fill="#fde047" stroke="#09090b" stroke-width="3.5"/>

  <!-- Perfectly Symmetrical & Balanced Monogram E V (Equal Width 13px, Equal Margin 8px) -->
  <g stroke="#09090b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Huruf E (x=10 to x=23) -->
    <line x1="10" y1="17" x2="10" y2="42"/>
    <line x1="10" y1="17" x2="23" y2="17"/>
    <line x1="10" y1="29.5" x2="19" y2="29.5"/>
    <line x1="10" y1="42" x2="23" y2="42"/>

    <!-- Huruf V (x=36 to x=49, Apex x=42.5) -->
    <line x1="36" y1="17" x2="42.5" y2="42"/>
    <line x1="49" y1="17" x2="42.5" y2="42"/>
  </g>
</svg>
